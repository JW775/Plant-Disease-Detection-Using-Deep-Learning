<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Disease Detection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #e8f5e9 0%, #f1f8e9 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }
        .card {
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            border: none;
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(to right, #2e7d32, #4caf50);
        }
        #preview {
            max-height: 320px;
            object-fit: cover;
            border-radius: 12px;
            display: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .loading-spinner {
            display: none;
        }
        .btn-success {
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
        }
        .form-control {
            border-radius: 10px;
            padding: 10px 14px;
        }
        .tip-box {
            font-size: 0.85rem;
            color: #555;
        }
        .alert-danger {
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card">
                <div class="card-header text-white text-center py-4">
                    <h3 class="mb-0 fw-bold">🌿 Plant Disease Detection</h3>
                    <p class="small opacity-75 mb-0">AI-powered Leaf Health Analysis</p>
                </div>

                <div class="card-body p-5">
                    <form id="uploadForm">
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Upload Leaf Image</label>
                            <input type="file" id="imageFile" class="form-control" accept="image/*" required>
                            <div class="tip-box mt-2">
                                ✔ Supported: JPG, PNG, JPEG
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success w-100 border-0">
                            Start Detect
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <img id="preview" class="img-fluid">
                    </div>

                    <div class="loading-spinner text-center mt-4">
                        <div class="spinner-border text-success"></div>
                        <p class="mt-2 text-muted">Analyzing image, please wait...</p>
                    </div>

                    <div id="resultArea" class="mt-5 d-none">
                        <hr>
                        <h5 class="text-center text-success fw-semibold">✅ Detection Result</h5>
                        <div id="resultText" class="alert text-center mt-3 fs-5"></div>
                    </div>
                </div>
            </div>

            <div class="text-center mt-4 text-muted small">
                Plant Disease Detection System | Designed for Course Project
            </div>
        </div>
    </div>
</div>

<script>
    const imageFile = document.getElementById('imageFile');
    const preview = document.getElementById('preview');
    const uploadForm = document.getElementById('uploadForm');
    const loading = document.querySelector('.loading-spinner');
    const resultArea = document.getElementById('resultArea');
    const resultText = document.getElementById('resultText');

    // 预览图片功能
    imageFile.addEventListener('change', function () {
        const file = imageFile.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    });

    // 提交表单并调用后端API
    uploadForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        
        // 检查是否选择了文件
        if (!imageFile.files[0]) {
            alert('请先选择要上传的图片！');
            return;
        }

        // 显示加载状态
        loading.style.display = 'block';
        resultArea.classList.add('d-none');
        
        try {
            // 创建FormData对象
            const formData = new FormData();
            formData.append('image', imageFile.files[0]);

            // 调用后端API
            const response = await fetch('http://127.0.0.1:5000/detect', {
                method: 'POST',
                body: formData
            });

            // 解析响应
            const data = await response.json();
            
            // 隐藏加载状态
            loading.style.display = 'none';
            
            if (response.ok) {
                // 显示成功结果
                resultArea.classList.remove('d-none');
                resultText.className = 'alert alert-success text-center mt-3 fs-5';
                resultText.textContent = data.result;
            } else {
                // 显示错误信息
                resultArea.classList.remove('d-none');
                resultText.className = 'alert alert-danger text-center mt-3 fs-5';
                resultText.textContent = `错误: ${data.error}`;
            }
        } catch (error) {
            // 处理网络错误
            loading.style.display = 'none';
            resultArea.classList.remove('d-none');
            resultText.className = 'alert alert-danger text-center mt-3 fs-5';
            resultText.textContent = `连接错误: 无法连接到服务器 (${error.message})`;
            console.error('Error:', error);
        }
    });
</script>

</body>
</html>
